name: Test check-contributor input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          username: github-actions[bot]
          check-contributor: 'true'
        continue-on-error: true
      - name: Assert check-result output is set
        env:
          RESULT: ${{ steps.action.outputs.check-result }}
        run: |
          echo "check-result: $RESULT"
          # The output should be 'true' or 'false' (or empty if action failed due to API limits)
          if [ "$RESULT" != "true" ] && [ "$RESULT" != "false" ] && [ -n "$RESULT" ]; then
            echo "FAIL: unexpected check-result value: $RESULT"
            exit 1
          fi
          echo "PASS: check-result=$RESULT"
