name: Test check-contributor flag
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Determine repo owner username
        id: owner
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "Using owner: $OWNER"
      - id: action
        uses: .
        # The action looks the user up against GITHUB_REPOSITORY via the GitHub
        # API, and the harness sets that to a sentinel slug which does not exist,
        # so the call 404s and the action calls setFailed. Tolerate that and
        # assert on the outcome instead.
        continue-on-error: true
        with:
          token: ${{ github.token }}
          username: ${{ steps.owner.outputs.owner }}
          check-contributor: 'true'
      - name: Assert action ran (check-result set, or failed on the sentinel repo)
        env:
          CHECK_RESULT: ${{ steps.action.outputs.check-result }}
          PERM: ${{ steps.action.outputs.user-permission }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "user-permission: $PERM"
          echo "check-result (is-contributor): $CHECK_RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$CHECK_RESULT" ]; then
              echo "FAIL: action succeeded but check-result output is empty"
              exit 1
            fi
            # check-result should be true or false
            case "$CHECK_RESULT" in
              true|false)
                echo "PASS: check-result is a valid boolean: $CHECK_RESULT"
                ;;
              *)
                echo "FAIL: unexpected check-result value: $CHECK_RESULT"
                exit 1
                ;;
            esac
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
