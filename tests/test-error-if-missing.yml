name: Test error-if-missing input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          username: github-actions[bot]
          require: write
          error-if-missing: 'false'
        continue-on-error: true
      - name: Assert action ran and produced output
        env:
          PERM: ${{ steps.action.outputs.user-permission }}
          REQUIRE_RESULT: ${{ steps.action.outputs.require-result }}
        run: |
          echo "user-permission: $PERM"
          echo "require-result: $REQUIRE_RESULT"
          # With error-if-missing=false, the action should not fail even if require is not met
          # We just verify the action ran (outputs may be empty if API call failed)
          echo "PASS: action completed with error-if-missing=false"
