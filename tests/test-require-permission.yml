name: Test require permission check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Determine repo owner username
        id: owner
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "Using owner: $OWNER"
      - id: action
        uses: .
        # The action looks the user up against GITHUB_REPOSITORY via the GitHub
        # API, and the harness sets that to a sentinel slug which does not exist,
        # so the call 404s and the action calls setFailed. Tolerate that and
        # assert on the outcome instead.
        continue-on-error: true
        with:
          token: ${{ github.token }}
          username: ${{ steps.owner.outputs.owner }}
          require: read
      - name: Assert action ran (require-result set, or failed on the sentinel repo)
        env:
          REQUIRE_RESULT: ${{ steps.action.outputs.require-result }}
          PERM: ${{ steps.action.outputs.user-permission }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "user-permission: $PERM"
          echo "require-result: $REQUIRE_RESULT"
          if [ "$OUTCOME" = "success" ]; then
            # The username here is derived from the sentinel GITHUB_REPOSITORY, so
            # it is not really the repo owner — assert the require gate produced a
            # well-formed verdict rather than pinning it to 'true'.
            case "$REQUIRE_RESULT" in
              true|false)
                echo "PASS: require-result is a valid boolean: $REQUIRE_RESULT"
                ;;
              *)
                echo "FAIL: expected require-result to be a boolean, got: '$REQUIRE_RESULT'"
                exit 1
                ;;
            esac
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
