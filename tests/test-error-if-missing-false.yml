name: Test error-if-missing false does not fail
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With error-if-missing: false, the action should not error even if
      # the user does not meet the required permission level.
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          username: github-actions[bot]
          require: admin
          error-if-missing: 'false'

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REQUIRE_RESULT: ${{ steps.action.outputs.require-result }}
          PERMISSION: ${{ steps.action.outputs.user-permission }}
        run: |
          echo "outcome: $OUTCOME"
          echo "user-permission: $PERMISSION"
          echo "require-result: $REQUIRE_RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PERMISSION" ]; then
              echo "FAIL: action succeeded but user-permission output is empty"
              exit 1
            fi
            # With error-if-missing: false, action should succeed even if require-result is false
            if [ "$REQUIRE_RESULT" != "true" ] && [ "$REQUIRE_RESULT" != "false" ]; then
              echo "FAIL: require-result should be 'true' or 'false', got '$REQUIRE_RESULT'"
              exit 1
            fi
            echo "PASS: permission='$PERMISSION' require-result='$REQUIRE_RESULT' (no error thrown)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
