name: Test basic user permission check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
      GITHUB_REPOSITORY: actions-cool/check-user-permission
      GITHUB_ACTOR: github-actions[bot]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
      - name: Assert action ran (outputs set or action failed gracefully)
        env:
          PERM: ${{ steps.action.outputs.user-permission }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "user-permission: $PERM"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PERM" ]; then
              echo "FAIL: action succeeded but user-permission output is empty"
              exit 1
            fi
            echo "PASS: user-permission is '$PERM'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected in act without real token)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
